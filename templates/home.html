<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Список задач{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-white border-bottom mb-4">
        <nav class="container py-3">
            <a class="h3 text-decoration-none" href="{{ url_for('retrieve_todos') }}">Список задач</a>
            <p class="text-secondary mb-0 mt-2">Практическая №5 · FastAPI и Jinja2 · {{ developer }}</p>
        </nav>
    </header>
    <main class="container pb-5">
        {% block todo_container %}{% endblock %}
    </main>
    <footer class="container pb-3 text-secondary">
        <a href="/docs">Документация API</a>
    </footer>
</body>
</html>
